<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- styles -->
    <link rel="stylesheet" href="../assets/css/aos.css">
    <link rel="stylesheet" href="../assets/css/style.css" />
    <!-- styles -->
    <title>Document</title>
</head>

<body style="padding: 12px;">
    <!-- body content start -->
    <div class="ab-propertytile">
        <div class="property-img">
            <img src="../assets/images/property1.avif" alt="img">
            <div class="whislist-icon">
                <svg class="whislist-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"
                    role="presentation" focusable="false"
                    style="display: block; fill: rgba(0, 0, 0, 0.5); height: 24px; width: 24px; stroke: var(--palette-icon-primary-inverse); stroke-width: 2; overflow: visible;">
                    <path
                        d="m15.9998 28.6668c7.1667-4.8847 14.3334-10.8844 14.3334-18.1088 0-1.84951-.6993-3.69794-2.0988-5.10877-1.3996-1.4098-3.2332-2.11573-5.0679-2.11573-1.8336 0-3.6683.70593-5.0668 2.11573l-2.0999 2.11677-2.0988-2.11677c-1.3995-1.4098-3.2332-2.11573-5.06783-2.11573-1.83364 0-3.66831.70593-5.06683 2.11573-1.39955 1.41083-2.09984 3.25926-2.09984 5.10877 0 7.2244 7.16667 13.2241 14.3333 18.1088z">
                    </path>
                </svg>
            </div>
            <span class="guest-fav">Guest Favourite</span>
        </div>
        <p class="property-name">Flat in Jaya Nagar</p>
        <p class="property-rating">
            ₹13,238 for 2 nights
            <svg viewBox="0 0 32 32" class="rating-star">
                <path
                    d="M15.093 2.364l3.09 6.26 6.91 1.004-5 4.873 1.18 6.877-6.18-3.25-6.18 3.25 1.18-6.877-5-4.873 6.91-1.004z">
                </path>
            </svg>
            4.92
        </p>
    </div>

    <div class="ab-propertytile see-all-tile">
        <div class="see-all-box">
            <div class="stack-images">
                <img src="../assets/images/property1.avif">
                <img src="../assets/images/property1.avif">
                <img src="../assets/images/property1.avif">
            </div>
            <p>See all</p>
        </div>

    </div>
    <!-- body content end -->

    <!-- scripts -->
    <script src="../assets/js/aos.js"></script>
    <script src="../assets/js/script.js"></script>
    <!-- scripts -->

    <script>
        document.querySelectorAll(".whislist-icon").forEach(icon => {
            icon.addEventListener("click", () => {
                icon.classList.toggle("active");
            });
        });
    </script>
</body>

</html>
